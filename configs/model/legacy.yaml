# The original PhysioWave model, unchanged.  Every new module is off by design:
# this file exists so the legacy path stays runnable and regression-testable.
model:
  name: legacy
  legacy:
    # NOTE: the legacy CrossScaleCAFFN builds a 4-head attention over 2*in_channels,
    # so the legacy path only accepts an even channel count divisible by 2 (19-channel
    # 10-20 montages cannot be run through it at all). This is an original limitation,
    # kept as-is; the new path has no such constraint.
    in_channels: 64
    max_level: 3
    wave_kernel_size: 16
    wavelet_names: [db4, db6, sym4]
    use_separate_channel: true
    patch_size: [1, 64]
    embed_dim: 256
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    use_pos_embed: true
    pos_embed_type: '2d'
    masking_strategy: frequency_guided
    importance_ratio: 0.6
    mask_ratio: 0.5
