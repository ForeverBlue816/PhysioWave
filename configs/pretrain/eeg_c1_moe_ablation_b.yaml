# Ablation B -- detach + raw fidelity, masking still after the frontend
#
# The ladder was run at the 1.0/0.25 weighting, and is PINNED to it here. The
# main config has since moved to 0.5/0.5, so inheriting its weights would
# silently re-base every rung against a different objective and the
# comparison would no longer be an ablation of the mechanism. Every
# objective key is therefore written out below rather than inherited.
defaults: [pretrain/eeg_c1_moe]

objective:
  spec_weight: 1.0
  raw_weight: 0.25
  raw_beta: 0.5
  fold_kl: 1.0e-3
  mask_before_frontend: false
  normalize_spec_target: true
